name: Validate maintenance application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and check duplicate definitions
        shell: pwsh
        run: ./Tests/Validate-Syntax.ps1
      - name: Cleanup and report safety regressions
        shell: pwsh
        run: ./Tests/Core.Smoke.ps1
      - name: Windows PowerShell 5.1 safety regressions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/Core.Smoke.ps1
      - name: Validate WPF layout and asynchronous workflow on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -File ./Otimizador-GUI.ps1 -ValidateUI -PreviewPath "$env:TEMP/optimizer-preview.png"
          if ($LASTEXITCODE -ne 0) { throw "WPF validation failed" }
          Write-Output ('PREVIEW_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:TEMP/optimizer-preview.png")))
