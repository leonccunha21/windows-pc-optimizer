name: Validate maintenance application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found issues."
          }

  safety:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and check duplicate definitions
        shell: pwsh
        run: ./Tests/Validate-Syntax.ps1
      - name: PSScriptAnalyzer advisory - core and interface
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $issues = @(@('Modules/Optimizer.Core.psm1','Otimizador-GUI.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Warning,Error })
          if ($issues.Count) { $issues | Format-Table -AutoSize | Out-String | Write-Host; throw 'PSScriptAnalyzer findings require triage.' }
      - name: Preferences safety smoke
        shell: pwsh
        run: ./Tests/Preferences.Smoke.ps1
      - name: Preferences Windows PowerShell 5.1 smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/Preferences.Smoke.ps1
      - name: UI structure and accessibility smoke
        shell: pwsh
        run: ./Tests/UI.UX.Smoke.ps1
      - name: UI accessibility under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/UI.UX.Smoke.ps1
      - name: Network diagnostics offline safety tests
        shell: pwsh
        run: ./Tests/Network.Smoke.ps1
      - name: Network diagnostics on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/Network.Smoke.ps1
      - name: Historical Windows events offline regression tests
        shell: pwsh
        run: ./Tests/Events.Smoke.ps1
      - name: Historical Windows events regression tests under PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/Events.Smoke.ps1
      - name: Declarative cleanup catalog tests
        shell: pwsh
        run: ./Tests/CleanupCatalog.Smoke.ps1
      - name: Declarative cleanup catalog under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/CleanupCatalog.Smoke.ps1
      - name: Technician inventory and repair allowlist tests
        shell: pwsh
        run: ./Tests/Technician.Smoke.ps1
      - name: Legacy regression checks without executing maintenance
        shell: pwsh
        run: ./Tests/Optimizer.Tests.ps1
      - name: Cleanup and report safety regressions
        shell: pwsh
        run: ./Tests/Core.Smoke.ps1
      - name: Windows PowerShell 5.1 safety regressions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Tests/Core.Smoke.ps1
      - name: Validate WPF layout and asynchronous workflow on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -File ./Otimizador-GUI.ps1 -ValidateUI -PreviewPath "$env:RUNNER_TEMP/optimizer-preview.png"
          if ($LASTEXITCODE -ne 0) { throw "WPF validation failed" }
      - name: Upload native interface preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-interface-preview
          path: ${{ runner.temp }}/optimizer-preview.png
          retention-days: 14
