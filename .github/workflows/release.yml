name: Package and publish Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and legacy safety
        shell: powershell
        run: |
          ./Tests/Validate-Syntax.ps1
          ./Tests/Optimizer.Tests.ps1
          ./Tests/Core.Smoke.ps1
          ./Tests/CleanupCatalog.Smoke.ps1
          ./Tests/Network.Smoke.ps1
          ./Tests/Events.Smoke.ps1
          ./Tests/UI.UX.Smoke.ps1
          ./Tests/Preferences.Smoke.ps1
          powershell.exe -NoProfile -STA -File ./Otimizador-GUI.ps1 -ValidateUI
          if ($LASTEXITCODE -ne 0) { throw 'WPF validation failed' }
      - name: Build portable package and SHA-256 checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./Tools/Build-Portable.ps1 -Version $version -OutputDirectory $env:RUNNER_TEMP -SkipTests -SkipUiValidation
          if ($LASTEXITCODE -ne 0) { throw 'Portable package build failed' }
      - name: Publish tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "PC-Optimizer-Portable-$version"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $sha)) { throw 'Portable release artifacts are missing' }
          gh release create "$env:GITHUB_REF_NAME" $zip $sha --verify-tag --generate-notes
